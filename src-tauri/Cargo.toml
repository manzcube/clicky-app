[package]
name = "clicky"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "A small helper that follows your cursor and acts on the text you highlight. Runs locally."
authors = ["you"]
license = "MIT"
repository = "https://github.com/YOURNAME/clicky"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

# Reading and writing the system clipboard.
arboard = "3"
# Sending the copy/paste keystrokes to whatever app is in front.
enigo = "0.2"
# Polling the mouse, for cursor-following and selection detection.
device_query = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
