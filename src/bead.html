<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>clicky bead</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  #bead {
    position: absolute;
    top: 50%; left: 50%;
    /* Rotated so the tip points back up toward the cursor it trails behind. */
    transform: translate(-50%, -50%) rotate(-40deg);
    width: 10px; height: 10px;
    transition: width .18s cubic-bezier(.2,.9,.3,1.2),
                height .18s cubic-bezier(.2,.9,.3,1.2);
    display: grid;
    place-items: center;
  }
  /* Stack the svg and the mark in the same cell instead of auto-flowing them
     into separate rows. */
  #bead > * { grid-area: 1 / 1; }
  /* SVG rather than clip-path/border-radius: a shape's box-shadow and hollow
     ring don't render cleanly through clip-path in WKWebView. Full opacity
     always — the gradient and highlight carry the "glass" look, so we don't
     also need to fade the whole thing down while idle. */
  #bead svg { width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 3px 6px rgba(10,40,90,.4)); }
  body.offer #bead { width: 26px; height: 26px; cursor: pointer; }
  body.offer #bead svg { filter: drop-shadow(0 4px 12px rgba(10,40,90,.5)); }
  body.offer #bead:hover { width: 30px; height: 30px; }

  /* One ring, once. Not a beacon. */
  #ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    transform: rotate(-40deg);
    opacity: 0;
    pointer-events: none;
  }
  #ring svg { width: 100%; height: 100%; }
  #ring polygon { fill: none; stroke: #4A93F0; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
  body.offer #ring { animation: ping .7s ease-out 1; }
  @keyframes ping {
    from { opacity: .7; transform: rotate(-40deg) scale(.6); }
    to   { opacity: 0;   transform: rotate(-40deg) scale(2.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div id="ring">
    <svg viewBox="0 0 100 100"><polygon points="50,20 78,82 50,58 22,82" /></svg>
  </div>
  <div id="bead" title="clicky">
    <svg viewBox="0 0 100 100">
      <defs>
        <linearGradient id="glass" x1="10%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E4F3FF" />
          <stop offset="50%" stop-color="#82B9F3" />
          <stop offset="100%" stop-color="#4079D8" />
        </linearGradient>
        <!-- Glass has thickness — darken toward the trailing edge instead of
             leaving the tint perfectly flat. -->
        <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="60%" stop-color="#0A2A6B" stop-opacity="0" />
          <stop offset="100%" stop-color="#0A2A6B" stop-opacity=".35" />
        </linearGradient>
        <filter id="soften"><feGaussianBlur stdDeviation="5" /></filter>
      </defs>
      <!-- The fill polygon is sharp-cornered; a stroke of the same fill,
           thick with round joins, is what actually rounds it off — cheaper
           and crisper than trying to hand-author rounded polygon points. -->
      <polygon points="50,20 78,82 50,58 22,82" fill="url(#glass)" fill-opacity=".38"
        stroke="url(#glass)" stroke-opacity=".38" stroke-width="30"
        stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="50,20 78,82 50,58 22,82" fill="url(#edge)" fill-opacity=".5"
        stroke="url(#edge)" stroke-opacity=".5" stroke-width="30"
        stroke-linejoin="round" stroke-linecap="round" />
      <!-- Rim light: glass catches an edge highlight. -->
      <polygon points="50,20 78,82 50,58 22,82" fill="none"
        stroke="rgba(255,255,255,.8)" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round" />
      <polygon points="50,24 64,48 50,42 39,48" fill="#fff" opacity=".65" filter="url(#soften)" />
    </svg>
  </div>

<script type="module">
const invoke = window.__TAURI__?.core?.invoke;
const listen = window.__TAURI__?.event?.listen;

let pending = "";
let timer = null;

function idle() {
  pending = "";
  document.body.classList.remove("offer");
  invoke?.("bead_clickthrough", { on: true });
  clearTimeout(timer);
}

function offer(text) {
  pending = text;
  document.body.classList.add("offer");
  invoke?.("bead_clickthrough", { on: false });

  // An offer you ignore should go away on its own. Nothing is more annoying
  // than a permanently lit badge.
  clearTimeout(timer);
  timer = setTimeout(idle, 9000);
}

document.getElementById("bead").addEventListener("click", () => {
  if (!pending) return;
  invoke?.("open_panel", { text: pending });
  idle();
});

listen?.("offer", (e) => offer(e.payload));
listen?.("offer-cleared", idle);
// If the panel opened by itself, the bead has nothing left to announce.
listen?.("summoned", idle);

idle();
</script>
</body>
</html>
